name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.2.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub release'
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    name: Build Windows (GitHub Hosted)
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Update version in project files
        run: |
          $version = "${{ github.event.inputs.version }}"
          Write-Host "Updating version to: $version"
          
          # Update Cargo.toml
          $cargoContent = Get-Content Cargo.toml -Raw
          $cargoContent = $cargoContent -replace 'version = "\d+\.\d+\.\d+"', "version = `"$version`""
          $cargoContent | Set-Content Cargo.toml -NoNewline
          Write-Host "[OK] Updated Cargo.toml"
          
          # Update package.json
          $packageContent = Get-Content ui/package.json -Raw
          $packageContent = $packageContent -replace '"version": "\d+\.\d+\.\d+"', "`"version`": `"$version`""
          $packageContent | Set-Content ui/package.json -NoNewline
          Write-Host "[OK] Updated package.json"
          
          # Update tauri.conf.json
          $tauriContent = Get-Content tauri.conf.json -Raw
          $tauriContent = $tauriContent -replace '"version": "\d+\.\d+\.\d+"', "`"version`": `"$version`""
          $tauriContent | Set-Content tauri.conf.json -NoNewline
          Write-Host "[OK] Updated tauri.conf.json"
          
          Write-Host ""
          Write-Host "[SUCCESS] Version updated to $version in all files"
        shell: powershell
      
      - name: Commit version changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Cargo.toml ui/package.json tauri.conf.json
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git push || echo "Nothing to push or already up to date"
        shell: bash
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      
      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci
      
      - name: Build UI
        working-directory: ./ui
        run: npm run build
      
      - name: Build Rust (Release)
        run: cargo build --release --verbose
      
      - name: Run tests
        run: cargo test --release --verbose
      
      - name: Create distribution folder
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/rustframe.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Copy-Item QUICK_START.md dist/
        shell: powershell
      
      - name: Create ZIP archive
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $zipName = "RustFrame-Windows-x64-$timestamp.zip"
          Compress-Archive -Path dist/* -DestinationPath $zipName
          Write-Host "Created: $zipName"
        shell: powershell
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustFrame-Windows-x64-${{ github.run_number }}
          path: RustFrame-Windows-x64-*.zip
          retention-days: 30
      
      - name: Build summary
        run: |
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Windows x64 (GitHub Hosted)" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust Version**: $(rustc --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        shell: bash
      
      - name: Create Git tag
        if: github.event.inputs.create_release == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Tag already exists or push failed"
          }
        shell: powershell
      
      - name: Create or Update GitHub Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: RustFrame v${{ github.event.inputs.version }}
          body: |
            # RustFrame v${{ github.event.inputs.version }}
            
            ## Windows Build
            
            Built with:
            - Runner: windows-latest (GitHub Hosted)
            - Rust: $(rustc --version)
            - Build #${{ github.run_number }}
            
            ### Installation
            1. Download `RustFrame-Windows-x64-*.zip`
            2. Extract the archive
            3. Run `rustframe.exe`
            
            ### Notes
            - First run may require Windows Defender approval
            - See QUICK_START.md for detailed instructions
          files: RustFrame-Windows-x64-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
