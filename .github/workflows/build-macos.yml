name: Build macOS

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        required: true
        type: choice
        options:
          - macos-latest
          - macos-14
          - macos-13
          - self-hosted
        default: 'macos-latest'
      architecture:
        description: 'Build architecture'
        required: true
        type: choice
        options:
          - universal
          - arm64-only
          - x86_64-only
        default: 'universal'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-macos:
    name: Build macOS
    runs-on: ${{ github.event.inputs.runner }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      
      - name: Install UI dependencies
        working-directory: ./ui
        run: npm ci
      
      - name: Build UI
        working-directory: ./ui
        run: npm run build
      
      - name: Build Rust for ARM64 (Apple Silicon)
        if: github.event.inputs.architecture == 'universal' || github.event.inputs.architecture == 'arm64-only'
        run: cargo build --release --target aarch64-apple-darwin --verbose
      
      - name: Build Rust for x86_64 (Intel)
        if: github.event.inputs.architecture == 'universal' || github.event.inputs.architecture == 'x86_64-only'
        run: cargo build --release --target x86_64-apple-darwin --verbose
      
      - name: Create universal binary
        if: github.event.inputs.architecture == 'universal'
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/rustframe \
            target/x86_64-apple-darwin/release/rustframe \
            -output target/universal-apple-darwin/release/rustframe
          lipo -info target/universal-apple-darwin/release/rustframe
      
      - name: Determine binary path
        id: binary-path
        run: |
          if [ "${{ github.event.inputs.architecture }}" = "universal" ]; then
            echo "path=target/universal-apple-darwin/release/rustframe" >> $GITHUB_OUTPUT
            echo "arch=Universal" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.architecture }}" = "arm64-only" ]; then
            echo "path=target/aarch64-apple-darwin/release/rustframe" >> $GITHUB_OUTPUT
            echo "arch=ARM64" >> $GITHUB_OUTPUT
          else
            echo "path=target/x86_64-apple-darwin/release/rustframe" >> $GITHUB_OUTPUT
            echo "arch=x86_64" >> $GITHUB_OUTPUT
          fi
      
      - name: Create .app bundle
        run: |
          mkdir -p RustFrame.app/Contents/MacOS
          mkdir -p RustFrame.app/Contents/Resources
          
          # Copy binary
          cp ${{ steps.binary-path.outputs.path }} RustFrame.app/Contents/MacOS/rustframe
          chmod +x RustFrame.app/Contents/MacOS/rustframe
          
          # Create Info.plist
          cat > RustFrame.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>rustframe</string>
              <key>CFBundleIdentifier</key>
              <string>com.salihcantekin.rustframe</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>RustFrame</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Ad-hoc code signing (for local use, not App Store)
          codesign --force --deep --sign - RustFrame.app
          
          echo "✅ .app bundle created and signed"
      
      - name: Create distribution folder
        run: |
          mkdir -p dist
          cp -r RustFrame.app dist/
          cp README.md dist/
          cp LICENSE dist/
          cp QUICK_START.md dist/
      
      - name: Create ZIP archive
        run: |
          cd dist
          timestamp=$(date +%Y%m%d-%H%M%S)
          arch="${{ steps.binary-path.outputs.arch }}"
          zipname="RustFrame-macOS-${arch}-${timestamp}.zip"
          zip -r "../${zipname}" *
          cd ..
          echo "Created: ${zipname}"
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustFrame-macOS-${{ steps.binary-path.outputs.arch }}-${{ github.run_number }}
          path: RustFrame-macOS-*.zip
          retention-days: 30
      
      - name: Build summary
        run: |
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: macOS" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture**: ${{ steps.binary-path.outputs.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ github.event.inputs.runner }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust Version**: $(rustc --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
